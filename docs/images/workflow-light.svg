<g class="pill k-cursor"><rect x="764" y="262" width="190" height="36" rx="7"/><text x="859.0" y="285.0">Cursor Agent</text></g>
<line class="flow" x1="358" x2="390" y1="280.0" y2="280.0" marker-end="url(#arr)"/>
