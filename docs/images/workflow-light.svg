<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 996" width="1200" height="996" role="img" aria-label="Routing: nine example requests traced through the Grok bot that takes them, the Mac lane, and the engine, with the Chief's decision rule for picking a lane.">
<style>svg{--bg:#f6f7f9;--surface:#ffffff;--band:#eceef3;--ink:#15181e;--muted:#5a6170;--rule:#d3d7df;--amber:#b26a00;--chief:#3d80f1;--ops:#e54796;--steward:#e66f30;--builder:#e79738;--keeper:#757675;--mac:#3d4452;--claude:#c96442;--codex:#10a37f}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg);stroke:var(--rule)}
.band{fill:var(--band);stroke:none}
.grp{font-size:11px;font-weight:700;letter-spacing:.08em;fill:var(--muted);text-anchor:middle}
.colh{font-size:11px;font-weight:700;letter-spacing:.08em;fill:var(--muted)}
.title{font-size:22px;font-weight:700}
.lede{font-size:13px;fill:var(--muted)}
.rule{stroke:var(--rule);stroke-width:1}
.req{font-size:13.5px;font-weight:500}
.req.q{font-style:italic}
.tag{fill:none;stroke:var(--muted);stroke-width:1.2}
.tagt{font-size:10px;font-weight:700;letter-spacing:.06em;fill:var(--muted)}
.pill rect{fill:var(--surface);stroke:var(--c);stroke-width:1.8}
.pill text{font-size:12.5px;font-weight:600;text-anchor:middle}
.pill text.small{font-size:11px;font-weight:400;fill:var(--muted)}
.k-chief{--c:var(--chief)}.k-ops{--c:var(--ops)}.k-steward{--c:var(--steward)}.k-builder{--c:var(--builder)}.k-keeper{--c:var(--keeper)}
.k-mac{--c:var(--mac)}.k-apply{--c:var(--amber)}.k-build{--c:var(--builder)}.k-grok{--c:var(--ink)}
.k-cursor{--c:var(--mac)}.k-claude{--c:var(--claude)}.k-codex{--c:var(--codex)}
.k-none rect{stroke-dasharray:4 3}.k-none{--c:var(--muted)}
.flow{stroke:var(--muted);stroke-width:1.3}
.skip{stroke:var(--rule);stroke-width:1.3;stroke-dasharray:3 4}
.none{font-size:10px;fill:var(--muted);text-anchor:middle;letter-spacing:.04em}
.res{font-size:12.5px;fill:var(--muted)}
.ah{fill:var(--muted)}
.h2{font-size:17px;font-weight:700}
.sub2{font-size:12.5px;fill:var(--muted)}
.q rect{fill:var(--band);stroke:var(--rule);stroke-width:1.2}
.q text{font-size:12px;font-weight:600;text-anchor:middle}
.yn{font-size:11px;fill:var(--muted);font-weight:600}
.foot{font-size:11.5px;fill:var(--muted)}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="1199" height="995" rx="14"/>
<text class="title" x="24" y="42">Who does what</text><text class="lede" x="24" y="66">Ten real requests, traced from the bot that takes them to the engine that does the work.</text><text class="lede" x="24" y="84">Grok handles conversation, mail and routing. Cursor answers one-command lookups. Claude Code does anything multi-step. Codex checks Claude.</text>
<rect class="band grok" x="382" y="104" width="164" height="610" rx="10"/>
<rect class="band mac" x="562" y="104" width="404" height="610" rx="10"/>
<text class="grp" x="464.0" y="124">GROK BOT · CLOUD</text>
<text class="grp" x="764.0" y="124">YOUR MAC · cos-run · or the Bot's browser</text>
<text class="colh" x="24" y="142" text-anchor="start">REQUEST</text>
<text class="colh" x="464.0" y="142" text-anchor="middle">WHO TAKES IT</text>
<text class="colh" x="649.0" y="142" text-anchor="middle">LANE</text>
<text class="colh" x="859.0" y="142" text-anchor="middle">ENGINE</text>
<text class="colh" x="994" y="142" text-anchor="start">RESULT</text>
<text class="req q" x="24" y="173.0">“What&#x27;s on my calendar tomorrow?”</text>
<g class="pill k-chief"><rect x="394" y="150" width="140" height="36" rx="7"/><text x="464.0" y="173.0">CHIEF</text></g>
<line class="skip" x1="584" x2="714" y1="168.0" y2="168.0"/><text class="none" x="649.0" y="162.0">no Mac</text>
<g class="pill k-grok"><rect x="764" y="150" width="190" height="36" rx="7"/><text x="859.0" y="173.0">Grok</text></g>
