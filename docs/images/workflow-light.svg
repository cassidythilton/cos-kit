<text class="res" x="994" y="397.0">Own branch, PR staged for you</text>
<line class="rule" x1="24" x2="1176" y1="420" y2="420"/>
<rect class="tag" x="24" y="431" width="113.0" height="16" rx="8"/><text class="tagt" x="31" y="443">SCHEDULED 16:00</text>
<text class="req" x="24" y="463">Daily capture onto the board</text>
<g class="pill k-steward"><rect x="394" y="430" width="140" height="36" rx="7"/><text x="464.0" y="453.0">STEWARD</text></g>
<g class="pill k-apply"><rect x="574" y="430" width="150" height="36" rx="7"/><text x="649.0" y="453.0">investigate → apply</text></g>
<g class="pill k-claude"><rect x="764" y="430" width="190" height="36" rx="7"/><text x="859.0" y="453.0">Claude Code, then none</text></g>
<line class="flow" x1="358" x2="390" y1="448.0" y2="448.0" marker-end="url(#arr)"/>
<line class="flow" x1="536" x2="570" y1="448.0" y2="448.0" marker-end="url(#arr)"/>
<line class="flow" x1="726" x2="760" y1="448.0" y2="448.0" marker-end="url(#arr)"/>
<line class="flow" x1="956" x2="984" y1="448.0" y2="448.0" marker-end="url(#arr)"/>
<text class="res" x="994" y="453.0">Batch by sha256. You approve.</text>
<line class="rule" x1="24" x2="1176" y1="476" y2="476"/>
<text class="req q" x="24" y="509.0">“Prototype the IQA low-confidence flag”</text>
<g class="pill k-builder"><rect x="394" y="486" width="140" height="36" rx="7"/><text x="464.0" y="509.0">BUILDER</text></g>
<g class="pill k-build"><rect x="574" y="486" width="150" height="36" rx="7"/><text x="649.0" y="509.0">pair · build</text></g>
<g class="pill k-claude"><rect x="764" y="486" width="190" height="36" rx="7"/><text x="859.0" y="509.0">Claude + verifier + Codex</text></g>
<line class="flow" x1="358" x2="390" y1="504.0" y2="504.0" marker-end="url(#arr)"/>
<line class="flow" x1="536" x2="570" y1="504.0" y2="504.0" marker-end="url(#arr)"/>
<line class="flow" x1="726" x2="760" y1="504.0" y2="504.0" marker-end="url(#arr)"/>
<line class="flow" x1="956" x2="984" y1="504.0" y2="504.0" marker-end="url(#arr)"/>
<text class="res" x="994" y="509.0">Proven slice, draft PR to owner</text>
<line class="rule" x1="24" x2="1176" y1="532" y2="532"/>
<text class="req q" x="24" y="565.0">“STEWARD keeps miscounting stale cards”</text>
<g class="pill k-keeper"><rect x="394" y="542" width="140" height="36" rx="7"/><text x="464.0" y="565.0">CHIEF → KEEPER</text></g>
<g class="pill k-keeper"><rect x="574" y="542" width="150" height="36" rx="7"/><text x="649.0" y="565.0">note → eval</text></g>
<g class="pill k-codex"><rect x="764" y="542" width="190" height="36" rx="7"/><text x="859.0" y="565.0">Claude, judged by Codex</text></g>
<line class="flow" x1="358" x2="390" y1="560.0" y2="560.0" marker-end="url(#arr)"/>
<line class="flow" x1="536" x2="570" y1="560.0" y2="560.0" marker-end="url(#arr)"/>
<line class="flow" x1="726" x2="760" y1="560.0" y2="560.0" marker-end="url(#arr)"/>
<line class="flow" x1="956" x2="984" y1="560.0" y2="560.0" marker-end="url(#arr)"/>
<text class="res" x="994" y="565.0">Tested fix. You apply it.</text>
<line class="rule" x1="24" x2="1176" y1="588" y2="588"/>
<rect class="tag" x="24" y="599" width="99.8" height="16" rx="8"/><text class="tagt" x="31" y="611">EVERY 2 HOURS</text>
<text class="req" x="24" y="631">Review requested on PR #704</text>
<g class="pill k-ops"><rect x="394" y="598" width="140" height="36" rx="7"/><text x="464.0" y="621.0">OPS · obligations</text></g>
<g class="pill k-apply"><rect x="574" y="598" width="150" height="36" rx="7"/><text x="649.0" y="621.0">investigate → standing</text></g>
<g class="pill k-claude"><rect x="764" y="598" width="190" height="36" rx="7"/><text x="859.0" y="621.0">Claude Code, review brief</text></g>
<line class="flow" x1="358" x2="390" y1="616.0" y2="616.0" marker-end="url(#arr)"/>
<line class="flow" x1="536" x2="570" y1="616.0" y2="616.0" marker-end="url(#arr)"/>
<line class="flow" x1="726" x2="760" y1="616.0" y2="616.0" marker-end="url(#arr)"/>
<line class="flow" x1="956" x2="984" y1="616.0" y2="616.0" marker-end="url(#arr)"/>
<text class="res" x="994" y="621.0">Review posted, told after</text>
<line class="rule" x1="24" x2="1176" y1="644" y2="644"/>
<text class="req q" x="24" y="677.0">“Find the transcript for the OGD call”</text>
<g class="pill k-chief"><rect x="394" y="654" width="140" height="36" rx="7"/><text x="464.0" y="677.0">CHIEF</text></g>
<g class="pill k-none"><rect x="574" y="654" width="150" height="36" rx="7"/><text x="649.0" y="677.0">browser, not Mac</text></g>
<g class="pill k-grok"><rect x="764" y="654" width="190" height="36" rx="7"/><text x="859.0" y="677.0">Grok computer</text></g>
<line class="flow" x1="358" x2="390" y1="672.0" y2="672.0" marker-end="url(#arr)"/>
<line class="flow" x1="536" x2="570" y1="672.0" y2="672.0" marker-end="url(#arr)"/>
<line class="flow" x1="726" x2="760" y1="672.0" y2="672.0" marker-end="url(#arr)"/>
<line class="flow" x1="956" x2="984" y1="672.0" y2="672.0" marker-end="url(#arr)"/>
<text class="res" x="994" y="677.0">Saved to the Mac, after your yes</text>
<text class="h2" x="24" y="750">How the Chief picks a lane</text>
<text class="sub2" x="24" y="772">Cheapest lane that can do the job. Every Claude job gets a checker. Every write needs your yes on its sha256.</text>
<g class="q"><rect x="24" y="798" width="196" height="52" rx="26"/><text x="122.0" y="829">Mail, Slack, calendar, web?</text></g>
<line class="flow" x1="122.0" x2="122.0" y1="852" y2="892" marker-end="url(#arr)"/><text class="yn" x="130.0" y="877">yes</text>
<g class="pill k-grok"><rect x="24" y="896" width="196" height="48" rx="7"/><text x="122.0" y="916">Chief does it itself</text><text class="small" x="122.0" y="933">Grok</text></g>
<line class="flow" x1="222" x2="252" y1="824.0" y2="824.0" marker-end="url(#arr)"/><text class="yn" x="238.0" y="817.0" text-anchor="middle">no</text>
<g class="q"><rect x="256" y="798" width="196" height="52" rx="26"/><text x="354.0" y="829">One command answers it?</text></g>
<line class="flow" x1="354.0" x2="354.0" y1="852" y2="892" marker-end="url(#arr)"/><text class="yn" x="362.0" y="877">yes</text>
<g class="pill k-cursor"><rect x="256" y="896" width="196" height="48" rx="7"/><text x="354.0" y="916">quick lane</text><text class="small" x="354.0" y="933">Cursor Agent</text></g>
<line class="flow" x1="454" x2="484" y1="824.0" y2="824.0" marker-end="url(#arr)"/><text class="yn" x="470.0" y="817.0" text-anchor="middle">no</text>
<g class="q"><rect x="488" y="798" width="196" height="52" rx="26"/><text x="586.0" y="829">A doc or repo change?</text></g>
<line class="flow" x1="586.0" x2="586.0" y1="852" y2="892" marker-end="url(#arr)"/><text class="yn" x="594.0" y="877">yes</text>
<g class="pill k-claude"><rect x="488" y="896" width="196" height="48" rx="7"/><text x="586.0" y="916">draft lane</text><text class="small" x="586.0" y="933">Claude Code</text></g>
<line class="flow" x1="686" x2="716" y1="824.0" y2="824.0" marker-end="url(#arr)"/><text class="yn" x="702.0" y="817.0" text-anchor="middle">no</text>
<g class="q"><rect x="720" y="798" width="196" height="52" rx="26"/><text x="818.0" y="829">Building software?</text></g>
<line class="flow" x1="818.0" x2="818.0" y1="852" y2="892" marker-end="url(#arr)"/><text class="yn" x="826.0" y="877">yes</text>
<g class="pill k-build"><rect x="720" y="896" width="196" height="48" rx="7"/><text x="818.0" y="916">BUILDER · pair or build</text><text class="small" x="818.0" y="933">Claude + verifier + Codex</text></g>
<line class="flow" x1="918" x2="948" y1="824.0" y2="824.0" marker-end="url(#arr)"/><text class="yn" x="934.0" y="817.0" text-anchor="middle">no</text>
<g class="pill k-claude"><rect x="952" y="798" width="224" height="52" rx="7"/><text x="1064.0" y="820">investigate lane</text><text class="small" x="1064.0" y="838">Claude Code, changes nothing</text></g>
<text class="foot" x="24" y="974">Canon or label builds skip the Codex review (canon charter decision 14). Grok never runs a command on the Mac unattended: scheduled jobs start on the Mac and push receipts.</text>
