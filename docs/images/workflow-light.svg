<g class="pill k-mac"><rect x="574" y="318" width="150" height="36" rx="7"/><text x="649.0" y="341.0">investigate</text></g>
<g class="pill k-claude"><rect x="764" y="318" width="190" height="36" rx="7"/><text x="859.0" y="341.0">Claude Code</text></g>
<line class="flow" x1="358" x2="390" y1="336.0" y2="336.0" marker-end="url(#arr)"/>
<line class="flow" x1="536" x2="570" y1="336.0" y2="336.0" marker-end="url(#arr)"/>
<line class="flow" x1="726" x2="760" y1="336.0" y2="336.0" marker-end="url(#arr)"/>
<line class="flow" x1="956" x2="984" y1="336.0" y2="336.0" marker-end="url(#arr)"/>
<text class="res" x="994" y="341.0">Quotes with timestamps, checked</text>
<line class="rule" x1="24" x2="1176" y1="364" y2="364"/>
<text class="req q" x="24" y="397.0">“Draft a DADR for the Bedrock exception”</text>
<g class="pill k-chief"><rect x="394" y="374" width="140" height="36" rx="7"/><text x="464.0" y="397.0">CHIEF</text></g>
<g class="pill k-mac"><rect x="574" y="374" width="150" height="36" rx="7"/><text x="649.0" y="397.0">draft</text></g>
<g class="pill k-claude"><rect x="764" y="374" width="190" height="36" rx="7"/><text x="859.0" y="397.0">Claude Code</text></g>
<line class="flow" x1="358" x2="390" y1="392.0" y2="392.0" marker-end="url(#arr)"/>
