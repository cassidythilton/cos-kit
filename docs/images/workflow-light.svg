<line class="flow" x1="536" x2="760" y1="168.0" y2="168.0" marker-end="url(#arr)"/>
<line class="flow" x1="956" x2="984" y1="168.0" y2="168.0" marker-end="url(#arr)"/>
<text class="res" x="994" y="173.0">Answer in chat. No Mac.</text>
<line class="rule" x1="24" x2="1176" y1="196" y2="196"/>
<text class="req q" x="24" y="229.0">“Draft a reply to Greta about the shortlist”</text>
<g class="pill k-chief"><rect x="394" y="206" width="140" height="36" rx="7"/><text x="464.0" y="229.0">CHIEF</text></g>
<line class="skip" x1="584" x2="714" y1="224.0" y2="224.0"/><text class="none" x="649.0" y="218.0">no Mac</text>
<g class="pill k-grok"><rect x="764" y="206" width="190" height="36" rx="7"/><text x="859.0" y="229.0">Grok · cassidy-voice</text></g>
<line class="flow" x1="358" x2="390" y1="224.0" y2="224.0" marker-end="url(#arr)"/>
<line class="flow" x1="536" x2="760" y1="224.0" y2="224.0" marker-end="url(#arr)"/>
<line class="flow" x1="956" x2="984" y1="224.0" y2="224.0" marker-end="url(#arr)"/>
<text class="res" x="994" y="229.0">Gmail draft. You send it.</text>
<line class="rule" x1="24" x2="1176" y1="252" y2="252"/>
<text class="req q" x="24" y="285.0">“Which of my cards are stale?”</text>
<g class="pill k-chief"><rect x="394" y="262" width="140" height="36" rx="7"/><text x="464.0" y="285.0">CHIEF</text></g>
